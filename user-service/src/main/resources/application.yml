# user-service 本地配置
# 公共配置已移至 Nacos: shared-common.yml, shared-sentinel.yml

server:
  port: 9001

spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        fail-fast: false
        enabled: true
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yml
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/trade_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
  data:
    redis:
      database: 0
      password: "123456"

# Seata 配置（user-service 不参与分布式事务）
seata:
  enabled: false

logging:
  level:
    com.trade.user: DEBUG
