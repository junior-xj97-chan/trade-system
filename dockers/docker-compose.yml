# ================================================================
# trade-system 涓棿浠?Docker Compose
# 鍖呭惈锛歁ySQL 路 Redis 路 RabbitMQ 路 Nacos 路 Seata 路 SkyWalking 路 Sentinel 路 XXL-JOB 路 Elasticsearch 路 Kibana
# 鍚姩鍛戒护锛歞ocker compose up -d
# 鍋滄鍛戒护锛歞ocker compose down
# ================================================================

# 鈹€鈹€ 鍏叡缃戠粶 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
networks:
  trade-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 鈹€鈹€ 鏁版嵁鍗凤紙鎸佷箙鍖栵級 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  seata-data:
  skywalking-data:
  xxljob-data:
  sentinel-data:
  es-data:

# ================================================================
# 鏈嶅姟瀹氫箟
# ================================================================
services:

  # 鈹€鈹€ 1. MySQL 8.0 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  mysql:
    image: mysql:8.0
    container_name: trade-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql123
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_general_ci
      # 鍏煎鏃х増璁よ瘉鎻掍欢锛堜笌椤圭洰涓?mysql_native_password 闂涓€鑷达級
      MYSQL_ROOT_HOST: '%'
      # 瀹㈡埛绔繛鎺ュ瓧绗﹂泦锛堣В鍐?Navicat/DBeaver 涓枃涔辩爜锛?
      LANG: zh_CN.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --explicit_defaults_for_timestamp=true
      - --max_connections=500
      - --innodb-buffer-pool-size=256M
      # 瀛楃闆嗛厤缃紙瑙ｅ喅涓枃涔辩爜锛?
      - --character-set-client-handshake=FALSE
      - --init_connect='SET NAMES utf8mb4'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 鍒濆鍖?SQL锛堟寜瀛楁瘝椤哄簭鎵ц锛?
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      trade-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysql123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 鈹€鈹€ 2. Redis 7.x 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  redis:
    image: redis:7.2
    container_name: trade-redis
    restart: unless-stopped
    command: redis-server --requirepass redis123 --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      trade-net:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 鈹€鈹€ 3. RabbitMQ 3.12锛堝甫绠＄悊鎻掍欢锛?鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: trade-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 绠＄悊鎺у埗鍙?
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      trade-net:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 鈹€鈹€ 4. Nacos 2.3.2锛堝崟鏈烘ā寮忥紝MySQL 瀛樺偍锛?鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: trade-nacos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: 172.20.0.10
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: mysql123
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"   # HTTP
      - "9848:9848"   # gRPC
      - "9849:9849"   # gRPC TLS
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      trade-net:
        ipv4_address: 172.20.0.13
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # 鈹€鈹€ 5. Seata 2.1.0锛堟敞鍐屽埌 Nacos锛?鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  seata:
    image: seataio/seata-server:2.1.0
    container_name: trade-seata
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      SEATA_IP: 127.0.0.1
      SEATA_PORT: 8091
      STORE_MODE: db
      SEATA_STORE_DB_DBTYPE: mysql
      SEATA_STORE_DB_DRIVER-CLASS-NAME: com.mysql.cj.jdbc.Driver
      SEATA_STORE_DB_URL: jdbc:mysql://172.20.0.10:3306/seata?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SEATA_STORE_DB_USER: root
      SEATA_STORE_DB_PASSWORD: mysql123
    ports:
      - "8091:8091"
      - "7091:7091"   # Seata Console
    volumes:
      # 瑕嗙洊 classpath 涓殑 application.yml锛屼娇鐢?Nacos 閰嶇疆涓績
      - ./seata/config/application.yml:/seata-server/resources/application.yml:ro
      - seata-data:/root/logs
    networks:
      trade-net:
        ipv4_address: 172.20.0.14

  # 鈹€鈹€ 6. SkyWalking OAP Server 9.6.0锛圡ySQL 瀛樺偍锛?鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  skywalking-oap:
    image: apache/skywalking-oap-server:9.6.0
    container_name: trade-skywalking-oap
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # 瑙ｅ喅 "Argument list too long" 闂
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 65536
        hard: 65536
    environment:
      SW_STORAGE: mysql
      SW_JDBC_URL: "jdbc:mysql://172.20.0.10:3306/skywalking?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SW_DATA_SOURCE_USER: root
      SW_DATA_SOURCE_PASSWORD: mysql123
      SW_CORE_REST_PORT: 12800
      SW_CORE_GRPC_PORT: 11800
      # 鏍稿績鎬ц兘璋冧紭
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: none
    ports:
      - "11800:11800"  # gRPC (Agent 鎺ュ叆)
      - "12800:12800"  # REST
    volumes:
      - skywalking-data:/opt/skywalking/logs
      - ./skywalking/oap-entrypoint.sh:/skywalking/docker-entrypoint.sh
    networks:
      trade-net:
        ipv4_address: 172.20.0.15
    healthcheck:
      test: ["CMD-SHELL", "curl -s -X POST http://localhost:12800/healthcheck || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s

  # 鈹€鈹€ 7. SkyWalking UI 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  skywalking-ui:
    image: apache/skywalking-ui:9.6.0
    container_name: trade-skywalking-ui
    restart: unless-stopped
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://172.20.0.15:12800
    ports:
      - "8088:8080"   # 淇濇寔鍘?8088 绔彛
    networks:
      trade-net:
        ipv4_address: 172.20.0.16

  # 鈹€鈹€ 8. Sentinel Dashboard 1.8.8 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: trade-sentinel
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -Dserver.port=8858
        -Dcsp.sentinel.dashboard.server=localhost:8858
        -Dproject.name=sentinel-dashboard
        -Dsentinel.dashboard.auth.username=sentinel
        -Dsentinel.dashboard.auth.password=sentinel
    ports:
      - "8858:8858"
    networks:
      trade-net:
        ipv4_address: 172.20.0.17

  # 鈹€鈹€ 9. XXL-JOB Admin 2.4.0 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  xxl-job:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: trade-xxljob
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://172.20.0.10:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=mysql123
        --xxl.job.accessToken=default_token
    ports:
      - "8081:8080"   # 淇濇寔鍘?8081 绔彛
    volumes:
      - xxljob-data:/data/applogs
    networks:
      trade-net:
        ipv4_address: 172.20.0.18

  # 鈹€鈹€ 10. Elasticsearch 8.12.0锛堝崟鑺傜偣锛?鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: trade-elasticsearch
    restart: unless-stopped
    environment:
      # 鍗曡妭鐐规ā寮?
      - discovery.type=single-node
      # 绂佺敤瀹夊叏璁よ瘉锛堝紑鍙戠幆澧冿級
      - xpack.security.enabled=false
      # JVM 鍐呭瓨閰嶇疆
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"   # REST API
      - "9300:9300"   # 鑺傜偣閫氫俊
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      trade-net:
        ipv4_address: 172.20.0.19
    # ES 闇€瑕佹洿楂樼殑璧勬簮闄愬埗
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # 鈹€鈹€ 11. Kibana 8.12.0锛圗S 鍙鍖栵級 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: trade-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://172.20.0.19:9200
      - I18N_LOCALE=zh-CN
    ports:
      - "5601:5601"
    networks:
      trade-net:
        ipv4_address: 172.20.0.20

  # 鈹€鈹€ 12. seckill-service 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  seckill-service:
    image: openjdk:21-jdk-slim
    container_name: trade-seckill-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_started
    volumes:
      - ../seckill-service/target/seckill-service-1.0.0.jar:/app/app.jar
      - ../seckill-service/src/main/resources/file.conf:/app/file.conf
    working_dir: /app
    entrypoint: ["java", "-jar", "/app/app.jar"]
    ports:
      - "9008:9008"
    networks:
      trade-net:
        ipv4_address: 172.20.0.21
