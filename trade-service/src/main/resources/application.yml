# trade-service 本地配置
# 公共配置已移至 Nacos: shared-common.yml, shared-sentinel.yml

server:
  port: 9003

spring:
  application:
    name: trade-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        fail-fast: false
        enabled: true
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yml
    alibaba:
      seata:
        fail-fast: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/trade_trade?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
  data:
    redis:
      database: 13
      password: "123456"

# Seata 配置（确保配置能被正确读取）
seata:
  enabled: false  # 暂时禁用 Seata，让服务先启动
  tx-service-group: trade-system-group
  service:
    vgroupMapping:
      trade-system-group: default

logging:
  level:
    com.trade.trade: DEBUG
