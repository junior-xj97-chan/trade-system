# ================================================================
# trade-system 中间件 Docker Compose
# 包含：MySQL · Redis · RabbitMQ · Nacos · Seata · SkyWalking · Sentinel · XXL-JOB · Elasticsearch · Kibana
# 启动命令：docker compose up -d
# 停止命令：docker compose down
# ================================================================

# ── 公共网络 ─────────────────────────────────────────────────────
networks:
  trade-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ── 数据卷（持久化） ──────────────────────────────────────────────
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  seata-data:
  skywalking-data:
  xxljob-data:
  sentinel-data:
  es-data:

# ================================================================
# 服务定义
# ================================================================
services:

  # ── 1. MySQL 8.0 ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: trade-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_general_ci
      # 兼容旧版认证插件（与项目中 mysql_native_password 问题一致）
      MYSQL_ROOT_HOST: '%'
      # 客户端连接字符集（解决 Navicat/DBeaver 中文乱码）
      LANG: zh_CN.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --explicit_defaults_for_timestamp=true
      - --max_connections=500
      - --innodb-buffer-pool-size=256M
      # 字符集配置（解决中文乱码）
      - --character-set-client-handshake=FALSE
      - --init_connect='SET NAMES utf8mb4'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化 SQL（按字母顺序执行）
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      trade-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── 2. Redis 7.x ──────────────────────────────────────────────
  redis:
    image: redis:7.2
    container_name: trade-redis
    restart: unless-stopped
    command: redis-server --requirepass 123456 --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      trade-net:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. RabbitMQ 3.12（带管理插件） ────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: trade-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理控制台
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      trade-net:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── 4. Nacos 2.3.2（单机模式，MySQL 存储） ────────────────────
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: trade-nacos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: 172.20.0.10
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root123
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"   # HTTP
      - "9848:9848"   # gRPC
      - "9849:9849"   # gRPC TLS
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      trade-net:
        ipv4_address: 172.20.0.13
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── 5. Seata 2.1.0（注册到 Nacos） ───────────────────────────
  seata:
    image: seataio/seata-server:2.1.0
    container_name: trade-seata
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      SEATA_IP: 127.0.0.1
      SEATA_PORT: 8091
      STORE_MODE: db
      SEATA_STORE_DB_DBTYPE: mysql
      SEATA_STORE_DB_DRIVER-CLASS-NAME: com.mysql.cj.jdbc.Driver
      SEATA_STORE_DB_URL: jdbc:mysql://172.20.0.10:3306/seata?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SEATA_STORE_DB_USER: root
      SEATA_STORE_DB_PASSWORD: root123
    ports:
      - "8091:8091"
      - "7091:7091"   # Seata Console
    volumes:
      # 覆盖 classpath 中的 application.yml，使用 Nacos 配置中心
      - ./seata/config/application.yml:/seata-server/resources/application.yml:ro
      - seata-data:/root/logs
    networks:
      trade-net:
        ipv4_address: 172.20.0.14

  # ── 6. SkyWalking OAP Server 9.6.0（MySQL 存储） ─────────────
  skywalking-oap:
    image: apache/skywalking-oap-server:9.6.0
    container_name: trade-skywalking-oap
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # 解决 "Argument list too long" 问题
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 65536
        hard: 65536
    environment:
      SW_STORAGE: mysql
      SW_JDBC_URL: "jdbc:mysql://172.20.0.10:3306/skywalking?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SW_DATA_SOURCE_USER: root
      SW_DATA_SOURCE_PASSWORD: root123
      SW_CORE_REST_PORT: 12800
      SW_CORE_GRPC_PORT: 11800
      # 核心性能调优
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: none
    ports:
      - "11800:11800"  # gRPC (Agent 接入)
      - "12800:12800"  # REST
    volumes:
      - skywalking-data:/opt/skywalking/logs
      - ./skywalking/oap-entrypoint.sh:/skywalking/docker-entrypoint.sh
    networks:
      trade-net:
        ipv4_address: 172.20.0.15
    healthcheck:
      test: ["CMD-SHELL", "curl -s -X POST http://localhost:12800/healthcheck || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s

  # ── 7. SkyWalking UI ─────────────────────────────────────────
  skywalking-ui:
    image: apache/skywalking-ui:9.6.0
    container_name: trade-skywalking-ui
    restart: unless-stopped
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://172.20.0.15:12800
    ports:
      - "8088:8080"   # 保持原 8088 端口
    networks:
      trade-net:
        ipv4_address: 172.20.0.16

  # ── 8. Sentinel Dashboard 1.8.8 ──────────────────────────────
  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: trade-sentinel
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -Dserver.port=8858
        -Dcsp.sentinel.dashboard.server=localhost:8858
        -Dproject.name=sentinel-dashboard
        -Dsentinel.dashboard.auth.username=sentinel
        -Dsentinel.dashboard.auth.password=sentinel
    ports:
      - "8858:8858"
    networks:
      trade-net:
        ipv4_address: 172.20.0.17

  # ── 9. XXL-JOB Admin 2.4.0 ───────────────────────────────────
  xxl-job:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: trade-xxljob
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://172.20.0.10:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=root123
        --xxl.job.accessToken=default_token
    ports:
      - "8081:8080"   # 保持原 8081 端口
    volumes:
      - xxljob-data:/data/applogs
    networks:
      trade-net:
        ipv4_address: 172.20.0.18

  # ── 10. Elasticsearch 8.12.0（单节点） ────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: trade-elasticsearch
    restart: unless-stopped
    environment:
      # 单节点模式
      - discovery.type=single-node
      # 禁用安全认证（开发环境）
      - xpack.security.enabled=false
      # JVM 内存配置
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"   # REST API
      - "9300:9300"   # 节点通信
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      trade-net:
        ipv4_address: 172.20.0.19
    # ES 需要更高的资源限制
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── 11. Kibana 8.12.0（ES 可视化） ──────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: trade-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      # 连接到 ES（使用容器内网络）
      - ELASTICSEARCH_HOSTS=http://172.20.0.19:9200
      # 汉化（可选）
      - I18N_LOCALE=zh-CN
    ports:
      - "5601:5601"   # Kibana Web UI
    networks:
      trade-net:
        ipv4_address: 172.20.0.20
