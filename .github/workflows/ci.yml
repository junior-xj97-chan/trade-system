name: CI - Build & DB Migration

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'backend/**'
  workflow_dispatch:   # 鍏佽鎵嬪姩瑙﹀彂

env:
  JAVA_VERSION: '21'
  MYSQL_ROOT_PASSWORD: mysql123
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: 3306

jobs:
  # -------------------------------------------------------
  # Job 1: 缂栬瘧鎵€鏈夊井鏈嶅姟
  # -------------------------------------------------------
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (skip tests)
        working-directory: backend
        run: mvn clean package -DskipTests -q

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: backend/**/target/*.jar
          retention-days: 3

  # -------------------------------------------------------
  # Job 2: 鏁版嵁搴撹縼绉伙紙Flyway锛?  # 渚濊禆 build 鎴愬姛鍚庢墽琛?  # -------------------------------------------------------
  db-migrate:
    name: DB Migration (Flyway)
    runs-on: ubuntu-latest
    needs: build

    # 鍚姩 MySQL 鏈嶅姟瀹瑰櫒
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_ALLOW_EMPTY_PASSWORD: "no"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -p${{ env.MYSQL_ROOT_PASSWORD }} --silent 2>/dev/null; then
              echo "MySQL is ready!"
              break
            fi
            echo "Attempt $i: MySQL not ready, waiting 3s..."
            sleep 3
          done

      - name: Create databases
        run: |
          mysql -h127.0.0.1 -uroot -p${{ env.MYSQL_ROOT_PASSWORD }} <<'EOF'
          CREATE DATABASE IF NOT EXISTS trade_user    DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE DATABASE IF NOT EXISTS trade_order   DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE DATABASE IF NOT EXISTS trade_trade   DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE DATABASE IF NOT EXISTS trade_account DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE DATABASE IF NOT EXISTS trade_product DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          SHOW DATABASES;
          EOF

      - name: Run Flyway migration - user-service
        working-directory: backend
        run: |
          mvn -pl user-service flyway:migrate \
            -Dflyway.url="jdbc:mysql://127.0.0.1:3306/trade_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true" \
            -Dflyway.user=root \
            -Dflyway.password=${{ env.MYSQL_ROOT_PASSWORD }} \
            -Dflyway.locations=classpath:db/migration \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.baselineVersion=0 \
            -q

      - name: Run Flyway migration - order-service
        working-directory: backend
        run: |
          mvn -pl order-service flyway:migrate \
            -Dflyway.url="jdbc:mysql://127.0.0.1:3306/trade_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true" \
            -Dflyway.user=root \
            -Dflyway.password=${{ env.MYSQL_ROOT_PASSWORD }} \
            -Dflyway.locations=classpath:db/migration \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.baselineVersion=0 \
            -q

      - name: Run Flyway migration - trade-service
        working-directory: backend
        run: |
          mvn -pl trade-service flyway:migrate \
            -Dflyway.url="jdbc:mysql://127.0.0.1:3306/trade_trade?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true" \
            -Dflyway.user=root \
            -Dflyway.password=${{ env.MYSQL_ROOT_PASSWORD }} \
            -Dflyway.locations=classpath:db/migration \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.baselineVersion=0 \
            -q

      - name: Run Flyway migration - account-service
        working-directory: backend
        run: |
          mvn -pl account-service flyway:migrate \
            -Dflyway.url="jdbc:mysql://127.0.0.1:3306/trade_account?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true" \
            -Dflyway.user=root \
            -Dflyway.password=${{ env.MYSQL_ROOT_PASSWORD }} \
            -Dflyway.locations=classpath:db/migration \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.baselineVersion=0 \
            -q

      - name: Run Flyway migration - product-service
        working-directory: backend
        run: |
          mvn -pl product-service flyway:migrate \
            -Dflyway.url="jdbc:mysql://127.0.0.1:3306/trade_product?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true" \
            -Dflyway.user=root \
            -Dflyway.password=${{ env.MYSQL_ROOT_PASSWORD }} \
            -Dflyway.locations=classpath:db/migration \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.baselineVersion=0 \
            -q

      - name: Verify migration results
        run: |
          echo "====== Flyway Migration Summary ======"
          mysql -h127.0.0.1 -uroot -p${{ env.MYSQL_ROOT_PASSWORD }} \
            -e "SELECT table_schema AS db, table_name AS 'table' FROM information_schema.tables WHERE table_schema IN ('trade_user','trade_order','trade_trade','trade_account','trade_product') ORDER BY table_schema, table_name;"
