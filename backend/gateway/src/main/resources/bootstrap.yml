# ========================================
# Bootstrap 上下文配置（优先级高于 application.yml）
# ========================================

spring:
  cloud:
    # 激活 bootstrap.yml 加载（Spring Boot 3.x 默认关闭）
    bootstrap:
      enabled: true
    nacos:
      username: nacos
      password: nacos
      # 服务发现配置
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        fail-fast: false
        enabled: true
      # 配置中心
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yml
        fail-fast: false
        # 暂时注释掉 shared-configs，避免配置覆盖问题
        # shared-configs:
        #   - data-id: shared-common.yml
        #     group: SHARED_GROUP
        #     refresh: true
        #   - data-id: shared-sentinel.yml
        #     group: SHARED_GROUP
        #     refresh: true

# 应用名称
application:
  name: gateway
