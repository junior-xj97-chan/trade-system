server:
  port: 9008

spring:
  application:
    name: seckill-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        fail-fast: false
        enabled: true
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yml
    alibaba:
      seata:
        fail-fast: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/trade_seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: mysql123
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    encoding: UTF-8
  data:
    redis:
      database: 15
      password: "redis123"
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

seata:
  enabled: true
  tx-service-group: trade-system-group
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
      data-id: seataServer.properties
  registry:
    type: file
    file:
      name: file.conf
  service:
    vgroupMapping:
      trade-system-group: default
    default:
      grouplist: 127.0.0.1:8091

seckill:
  salt: "seckill_salt_trade_2026"
  order-timeout-minutes: 15
  pay-max-retry-count: 3
  path-expire-minutes: 5
  result-cache-minutes: 10
  preheat-before-start-minutes: 30

xxl:
  job:
    admin:
      addresses: http://127.0.0.1:8081/xxl-job-admin
      accessToken: default_token
      timeout: 3
    executor:
      appname: seckill-service
      enabled: true
      port: 9998
      logpath: ./logs/xxl-job/jobhandler
      logretentiondays: 30

logging:
  level:
    com.trade.seckill: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: seckill-service
    description: 秒杀服务
