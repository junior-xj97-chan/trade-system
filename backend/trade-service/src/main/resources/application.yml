# trade-service 本地配置
# 公共配置已移至 Nacos: shared-common.yml, shared-sentinel.yml

server:
  port: 9003

spring:
  application:
    name: trade-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        fail-fast: false
        enabled: true
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yml
    alibaba:
      seata:
        fail-fast: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/trade_trade?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    encoding: UTF-8
  data:
    redis:
      database: 13
      password: "123456"

# Seata 配置
seata:
  enabled: true   # trade-service 参与分布式事务
  tx-service-group: trade-system-group
  # 配置中心使用 Nacos
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
      data-id: seataServer.properties
  # 注册中心使用 file 类型（直接使用本地 grouplist，不走 Nacos 注册中心）
  registry:
    type: file
    file:
      name: file.conf
  service:
    vgroupMapping:
      trade-system-group: default
    # grouplist 的 key 是集群名(default)，不是事务组名
    default:
      grouplist: 127.0.0.1:8091

logging:
  level:
    com.trade.trade: DEBUG
