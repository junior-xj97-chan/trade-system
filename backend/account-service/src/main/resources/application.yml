# account-service 本地配置
# 公共配置已迁移至 Nacos: shared-common.yml

server:
  port: 9004

spring:
  application:
    name: account-service
  seata:
    enabled: false
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        group: DEFAULT_GROUP
        fail-fast: false
        enabled: true
      config:
        server-addr: nacos:8848
        group: DEFAULT_GROUP
        file-extension: yml
  datasource:
    url: jdbc:mysql://mysql:3306/trade_account?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: mysql123
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    encoding: UTF-8
  data:
    redis:
      host: redis
      port: 6379
      database: 11
      password: "redis123"

logging:
  level:
    com.trade.account: DEBUG

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: account-service
    description: 璐︽埛鏈嶅姟
