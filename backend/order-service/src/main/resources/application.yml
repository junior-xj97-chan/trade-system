# order-service 鏈湴閰嶇疆
# 鍏叡閰嶇疆宸茬Щ鑷?Nacos: shared-common.yml, shared-sentinel.yml

server:
  port: 9002

spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        fail-fast: false
        enabled: true
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yml
    alibaba:
      seata:
        fail-fast: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/trade_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: mysql123
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    encoding: UTF-8
  data:
    redis:
      database: 12
      password: "redis123"
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /

# Seata 閰嶇疆
seata:
  enabled: true   # order-service 鍙備笌鍒嗗竷寮忎簨鍔?
  tx-service-group: trade-system-group
  # 閰嶇疆涓績浣跨敤 Nacos
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
      data-id: seataServer.properties
  # 娉ㄥ唽涓績浣跨敤 file 绫诲瀷锛堢洿鎺ヤ娇鐢ㄦ湰鍦?grouplist锛屼笉璧?Nacos 娉ㄥ唽涓績锛?
  registry:
    type: file
    file:
      name: file.conf
  service:
    vgroupMapping:
      trade-system-group: default
    # grouplist 鐨?key 鏄泦缇ゅ悕(default)锛屼笉鏄簨鍔＄粍鍚?
    default:
      grouplist: 127.0.0.1:8091

# 璁㈠崟瓒呮椂閰嶇疆
order:
  timeout-minutes: 30

# XXL-JOB 鎵ц鍣ㄩ厤缃?
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:8081/xxl-job-admin
      accessToken: default_token
      timeout: 3
    executor:
      appname: order-service
      enabled: true
      port: 9999
      logpath: ./logs/xxl-job/jobhandler
      logretentiondays: 30

# 鏈湇鍔℃棩蹇楃骇鍒?
logging:
  level:
    com.trade.order: DEBUG

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: order-service
    description: 璁㈠崟鏈嶅姟
