server:
  port: 9010

spring:
  application:
    name: quote-service
  datasource:
    url: jdbc:mysql://localhost:3306/trade_quote?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

tushare:
  token: ${TUSHARE_TOKEN:your-tushare-token}
  poll-interval-ms: 1000
  thread-pool-size: 4

quote:
  cache:
    realtime-ttl: 30s
    daily-ttl: 5m
    search-ttl: 1h
    pre-close-ttl: 1d
  push:
    price-threshold: 0.01
    percent-threshold: 0.01
    min-interval-ms: 1000
  alert:
    fallback-cron: "0 */5 * * * ?"

logging:
  level:
    com.trade.quote: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
