# ai-service 本地配置
# OpenRouter 配置通过环境变量 OPENROUTER_API_KEY 注入（不要硬编码）

server:
  port: 9007

spring:
  application:
    name: ai-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        fail-fast: false
        enabled: true
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yml

  # Spring AI OpenRouter 配置
  ai:
    openai:
      # API Key 从环境变量读取（本地开发时设置 OPENROUTER_API_KEY）
      api-key: ${OPENROUTER_API_KEY}
      # OpenRouter API 地址（OpenAI 兼容）
      base-url: https://openrouter.ai/api
      chat:
        options:
          # 默认模型
          model: tencent/hy3-preview:free
          temperature: 0.7
          max-tokens: 2048

  # Redis 配置（多轮对话历史存储）
  data:
    redis:
      database: 0
      password: "123456"

  # AI 对话配置
ai:
  chat:
    # 每个会话最多保留的消息条数（控制 Token 消耗）
    max-history-size: 20
    # 会话过期时间（秒），默认 30 分钟
    session-ttl-seconds: 1800

# Seata 不参与分布式事务
seata:
  enabled: false

logging:
  level:
    com.trade.ai: DEBUG
    org.springframework.ai: DEBUG
