# ========================================
# Bootstrap 上下文配置
# ========================================

spring:
  cloud:
    bootstrap:
      enabled: true
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        fail-fast: false
        enabled: true
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yml
        fail-fast: false
        # 引入公共 Redis 配置
        shared-configs:
          - data-id: user-config.yaml
            group: DEFAULT_GROUP
            refresh: true

application:
  name: ai-service
